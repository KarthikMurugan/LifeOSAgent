[project]
name = "dayglow"
version = "0.1.0"
description = "Dayglow FastAPI and LangGraph daily planning assignment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "python-dotenv>=1.2.4",
    "langchain-ollama>=1.1.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
